[pytest]
# Seul tests/ est collecte. scripts/ contient des diagnostics manuels
# (fenetres Qt, attente d'une saisie clavier) qui bloqueraient une execution
# automatisee.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra : resume de tous les tests non passants en fin de run
addopts = -ra --strict-markers

markers =
    slow: test lent (chargement d'un modele Whisper, inference GPU)
    gpu: necessite un GPU CUDA disponible
