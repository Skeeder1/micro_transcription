<!DOCTYPE html>
<html lang='fr'>
<head>
  <meta charset='utf-8'>
  <title>Visualiseur micro avancé</title>
  <link rel="stylesheet" href="qrc:///static/css/visualizer.css">
</head>
<body>
  <div class='panel'>
    <div class='toolbar'>
      <button id='rec-btn' class='rec-active' title='Enregistrement ON/OFF (F8)'>
        <span class='rec-icon'>🎤</span>
      </button>

      <!-- VAD Indicator -->
      <div id='vad-indicator' class='indicator' title='Detection vocale'>
        <span class='indicator-dot'></span>
        <span class='indicator-label'>VAD</span>
      </div>

      <!-- Processing Indicator -->
      <div id='processing-indicator' class='indicator' title='Transcription en cours'>
        <span class='indicator-spinner'></span>
        <span class='indicator-label'>AI</span>
      </div>

      <div class='spacer'></div>

      <span id='status'>En attente...</span>
      <span id='sse-status' title='Connexion SSE'></span>
    </div>

    <div id='mic' style='margin-top:12px;'></div>

    <div id='preview-container'>
      <div id='preview-text' class='empty'>En attente de parole...</div>
    </div>

    <div id='error'></div>
  </div>

  <script src='https://unpkg.com/wavesurfer.js@7'></script>
  <script src='https://unpkg.com/wavesurfer.js@7/dist/plugins/record.min.js'></script>
  <script src='qrc:///qtwebchannel/qwebchannel.js'></script>

  <!-- Inject SSE port from Python -->
  <script>
    window.SSE_PORT = {{SSE_PORT}};
  </script>

  <script src="qrc:///static/js/visualizer.js"></script>
</body>
</html>
