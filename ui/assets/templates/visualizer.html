<!DOCTYPE html>
<html lang='fr'>
<head>
  <meta charset='utf-8'>
  <title>Visualiseur micro avance</title>
  <link rel="stylesheet" href="qrc:///static/css/visualizer.css">
</head>
<body>
  <div class='panel'>
    <div class='toolbar'>
      <button id='rec-btn' class='rec-paused' title='Enregistrement ON/OFF (F8)'>
        <span class='rec-icon'>⏸️</span>
      </button>

      <div class='spacer'></div>

      <span id='status'>En attente...</span>
      <span id='status-spinner' class='status-spinner hidden'></span>
      <span id='sse-status' title='Connexion SSE'></span>
    </div>

    <!-- Canvas Waveform - remplace WaveSurfer -->
    <canvas id='waveform-canvas'></canvas>

    <div id='preview-container'>
      <div id='preview-text' class='empty'>En attente de parole...</div>
    </div>

    <div id='error'></div>
  </div>

  <!-- Qt WebChannel - loaded via qrc or fallback -->
  <script src='qrc:///qtwebchannel/qwebchannel.js' onerror="console.warn('qwebchannel.js not loaded via qrc, WebChannel disabled')"></script>

  <!-- Inject SSE port from Python -->
  <script>
    window.SSE_PORT = {{SSE_PORT}};
    console.log('[HTML] SSE_PORT set to:', window.SSE_PORT);
  </script>

  <!-- Custom canvas waveform - Web Audio API direct -->
  <script src="qrc:///static/js/visualizer.js"></script>
</body>
</html>
