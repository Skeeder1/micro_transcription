<!DOCTYPE html>
<html lang='fr'>
<head>
  <meta charset='utf-8'>
  <title>Visualiseur micro avancé</title>
  <link rel="stylesheet" href="qrc:///static/css/visualizer.css">
</head>
<body>
  <div class='panel'>
    <div class='toolbar'>
      <button id='rec-btn' class='rec-active' title='Enregistrement ON/OFF (F8)'>🎤</button>
      <select id='mic-select'><option value='' hidden>Sélection micro</option></select>
      <span id='status'>Monitoring...</span>
      <span id='sse-status' title='SSE connection'></span>
    </div>

    <div id='mic' style='margin-top:12px;'></div>

    <div id='preview-container'>
      <div id='preview-text' class='empty'>En attente de parole...</div>
    </div>

    <div id='error'></div>
  </div>

  <script src='https://unpkg.com/wavesurfer.js@7'></script>
  <script src='qrc:///qtwebchannel/qwebchannel.js'></script>

  <!-- Inject SSE port from Python -->
  <script>
    window.SSE_PORT = {{SSE_PORT}};
  </script>

  <script type='module' src="qrc:///static/js/visualizer.js"></script>
</body>
</html>
