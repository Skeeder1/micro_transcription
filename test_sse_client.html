<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test SSE - Réception messages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #333;
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            color: #4af;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .connected {
            background: #2d5;
            color: #000;
        }
        .disconnected {
            background: #d52;
            color: #fff;
        }
        #messages {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        .message {
            padding: 8px;
            margin: 5px 0;
            background: #2a2a2a;
            border-left: 3px solid #4af;
            border-radius: 3px;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .timestamp {
            color: #888;
            font-size: 0.9em;
        }
        button {
            background: #4af;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #6cf;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 Test SSE - Réception messages</h1>
        
        <div id="status" class="disconnected">
            ❌ Déconnecté
        </div>
        
        <div>
            <button onclick="connect()">🔌 Connecter</button>
            <button onclick="disconnect()">⛔ Déconnecter</button>
            <button onclick="clearMessages()">🗑️ Effacer</button>
        </div>
        
        <h3>📨 Messages reçus :</h3>
        <div id="messages"></div>
        
        <div style="margin-top: 20px; padding: 10px; background: #2a2a2a; border-radius: 5px;">
            <strong>Instructions :</strong>
            <ol>
                <li>Lancez <code>test_sse_server.py</code> ou <code>main_enhanced.py</code></li>
                <li>Cliquez sur "Connecter"</li>
                <li>Vous devriez voir les messages apparaître ici</li>
            </ol>
            <p><strong>URL SSE :</strong> http://127.0.0.1:5432/events</p>
        </div>
    </div>

    <script>
        let eventSource = null;
        let messageCount = 0;

        function connect() {
            if (eventSource) {
                console.log('Déjà connecté');
                return;
            }

            console.log('Connexion à SSE...');
            eventSource = new EventSource('http://127.0.0.1:5432/events');
            
            eventSource.onopen = () => {
                console.log('✅ Connecté !');
                document.getElementById('status').className = 'connected';
                document.getElementById('status').textContent = '✅ Connecté';
                addMessage('🔌 Connexion établie', 'system');
            };
            
            eventSource.onmessage = (event) => {
                console.log('📨 Message reçu:', event.data);
                addMessage(event.data, 'data');
            };
            
            eventSource.onerror = (error) => {
                console.error('❌ Erreur SSE:', error);
                document.getElementById('status').className = 'disconnected';
                document.getElementById('status').textContent = '❌ Erreur / Déconnecté';
                
                if (eventSource.readyState === EventSource.CLOSED) {
                    addMessage('⚠️ Connexion fermée', 'error');
                    eventSource = null;
                }
            };
        }

        function disconnect() {
            if (eventSource) {
                console.log('Déconnexion...');
                eventSource.close();
                eventSource = null;
                document.getElementById('status').className = 'disconnected';
                document.getElementById('status').textContent = '❌ Déconnecté';
                addMessage('⛔ Déconnexion manuelle', 'system');
            }
        }

        function addMessage(text, type) {
            messageCount++;
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            const now = new Date();
            const timestamp = now.toLocaleTimeString();
            
            let icon = '💬';
            if (type === 'system') icon = '⚙️';
            if (type === 'error') icon = '⚠️';
            
            msgDiv.innerHTML = `
                <span class="timestamp">[${timestamp}]</span>
                ${icon} <strong>#${messageCount}:</strong> ${text}
            `;
            
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            messageCount = 0;
        }

        // Auto-connect au chargement
        window.addEventListener('load', () => {
            console.log('Page chargée, tentative de connexion dans 1 seconde...');
            setTimeout(connect, 1000);
        });
    </script>
</body>
</html>
