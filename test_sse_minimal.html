<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test SSE Minimal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        #status {
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 18px;
            text-align: center;
        }
        .connected {
            background: #2d5016;
            color: #4caf50;
            border: 2px solid #4caf50;
        }
        .disconnected {
            background: #3d1a1a;
            color: #f44336;
            border: 2px solid #f44336;
        }
        .waiting {
            background: #3d3d1a;
            color: #ffc107;
            border: 2px solid #ffc107;
        }
        #messages {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        .message {
            padding: 8px;
            margin: 5px 0;
            background: #3a3a3a;
            border-left: 3px solid #4caf50;
            border-radius: 4px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .time {
            color: #888;
            font-size: 12px;
        }
        button {
            padding: 12px 24px;
            margin: 10px 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-connect {
            background: #4caf50;
            color: white;
        }
        .btn-disconnect {
            background: #f44336;
            color: white;
        }
        .btn-clear {
            background: #2196f3;
            color: white;
        }
    </style>
</head>
<body>
    <h1>🧪 Test SSE Minimal</h1>
    
    <div id="status" class="waiting">⏳ En attente...</div>
    
    <div>
        <button class="btn-connect" onclick="connect()">🔗 Connecter</button>
        <button class="btn-disconnect" onclick="disconnect()">❌ Déconnecter</button>
        <button class="btn-clear" onclick="clearMessages()">🗑️ Effacer</button>
    </div>
    
    <h2>Messages reçus :</h2>
    <div id="messages"></div>

    <script>
        let eventSource = null;
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');

        function updateStatus(message, className) {
            statusDiv.textContent = message;
            statusDiv.className = className;
        }

        function addMessage(text) {
            const now = new Date().toLocaleTimeString();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<span class="time">[${now}]</span> ${text}`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function connect() {
            if (eventSource) {
                console.log('Déjà connecté');
                return;
            }

            updateStatus('🔄 Connexion...', 'waiting');
            addMessage('🔄 Tentative de connexion à http://127.0.0.1:5432/events');

            eventSource = new EventSource('http://127.0.0.1:5432/events');

            eventSource.onopen = () => {
                console.log('[SSE] Connecté');
                updateStatus('✅ Connecté au serveur SSE', 'connected');
                addMessage('✅ Connexion établie!');
            };

            eventSource.onmessage = (event) => {
                console.log('[SSE] Message:', event.data);
                addMessage('📨 ' + event.data);
            };

            eventSource.onerror = (error) => {
                console.error('[SSE] Erreur:', error);
                updateStatus('❌ Erreur de connexion', 'disconnected');
                addMessage('❌ Erreur de connexion - Reconnexion dans 2s...');
                
                if (eventSource.readyState === EventSource.CLOSED) {
                    eventSource = null;
                    setTimeout(connect, 2000);
                }
            };
        }

        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                updateStatus('⏹️ Déconnecté', 'waiting');
                addMessage('⏹️ Déconnexion manuelle');
            }
        }

        function clearMessages() {
            messagesDiv.innerHTML = '';
            addMessage('🗑️ Messages effacés');
        }

        // Auto-connect au chargement
        window.addEventListener('load', () => {
            console.log('Page chargée - Connexion auto');
            connect();
        });
    </script>
</body>
</html>
