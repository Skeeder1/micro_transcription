<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='utf-8'>
<title>Test Visualiseur micro</title>
<style>
  :root { color-scheme: dark; }
  body { background:#222; margin:0; display:flex; height:100vh; align-items:center; justify-content:center; font-family:Arial, sans-serif; }
  .panel { width:900px; background:#2b2b2b; border-radius:16px; padding:24px 28px 32px; box-shadow:0 10px 30px rgba(0,0,0,.35); position:relative; color:#ddd; }
  #mic { height:120px; border-radius:8px; overflow:hidden; background:#1a1a1a; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  button { background:#3a3a3a; color:#f2f2f2; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  select { background:#3a3a3a; color:#f2f2f2; border:0; padding:6px 10px; border-radius:6px; }
  label { font-size:13px; display:flex; align-items:center; gap:6px; }
  #progress { margin:8px 0 0; font-variant-numeric:tabular-nums; }
  #recordings { margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .options { display:flex; gap:20px; align-items:center; margin-top:6px; }
  #error { color:#ff6b6b; margin-top:12px; font-size:13px; }
  #debug { color:#6b9eff; margin-top:8px; font-size:11px; font-family:monospace; }
</style>
</head>
<body>
  <div class='panel'>
    <div class='toolbar'>
      <button id='record'>Record</button>
      <button id='pause' style='display:none;'>Pause</button>
      <select id='mic-select'><option value='' hidden>Sélection micro</option></select>
      <span id='progress'>00:00</span>
    </div>
    <div class='options'>
      <label><input type='checkbox' id='scrollingWaveform'>Scrolling waveform</label>
      <label><input type='checkbox' id='continuousWaveform' checked>Continuous waveform</label>
    </div>
    <div id='mic' style='margin-top:16px;'></div>
    <div id='error'></div>
    <div id='debug'>Loading...</div>
    <div id='recordings'></div>
  </div>

  <script src='https://unpkg.com/wavesurfer.js@7'></script>
  <script type='module'>
    const debugLog = (msg) => {
      const debugDiv = document.querySelector('#debug');
      if (debugDiv) {
        debugDiv.textContent += '\n' + msg;
      }
      console.log('[DEBUG]', msg);
    };

    debugLog('Script module loaded');

    // Import du plugin Record depuis le module ES
    import RecordPlugin from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/record.esm.js';
    
    debugLog('RecordPlugin imported');

    let wavesurfer;
    let record;
    let scrollingWaveform = false;
    let continuousWaveform = true;

    const progressLabel = document.querySelector('#progress');
    const micSelect = document.querySelector('#mic-select');
    const recButton = document.querySelector('#record');
    const pauseButton = document.querySelector('#pause');
    const recordingsContainer = document.querySelector('#recordings');

    const formatTime = (ms) => {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return [minutes, seconds].map((v) => (v < 10 ? '0' + v : '' + v)).join(':');
    };

    const updateProgress = (ms) => {
      progressLabel.textContent = formatTime(ms);
    };

    const resetProgress = () => {
      progressLabel.textContent = '00:00';
    };

    const showError = (msg) => {
      const errorDiv = document.querySelector('#error');
      if (errorDiv) {
        errorDiv.textContent = msg;
        console.error(msg);
      }
    };

    const createWaveSurfer = () => {
      debugLog('Creating WaveSurfer instance...');
      if (wavesurfer) {
        wavesurfer.destroy();
      }

      wavesurfer = WaveSurfer.create({
        container: '#mic',
        waveColor: 'rgb(205, 205, 205)',
        progressColor: 'rgb(255, 255, 255)',
        cursorWidth: 0,
      });

      debugLog('Registering RecordPlugin...');
      record = wavesurfer.registerPlugin(RecordPlugin.create({
        renderRecordedAudio: false,
        scrollingWaveform,
        continuousWaveform,
        continuousWaveformDuration: 30,
      }));

      debugLog('RecordPlugin registered');

      record.on('record-end', (blob) => {
        const url = URL.createObjectURL(blob);

        const wrapper = document.createElement('div');
        wrapper.style.display = 'flex';
        wrapper.style.gap = '8px';
        wrapper.style.alignItems = 'center';

        const playbackContainer = wrapper.appendChild(document.createElement('div'));
        playbackContainer.style.flex = '1';

        const clip = WaveSurfer.create({
          container: playbackContainer,
          waveColor: 'rgb(200, 100, 0)',
          progressColor: 'rgb(100, 50, 0)',
          url,
        });

        const playBtn = wrapper.appendChild(document.createElement('button'));
        playBtn.textContent = 'Play';
        playBtn.onclick = () => clip.playPause();
        clip.on('play', () => (playBtn.textContent = 'Pause'));
        clip.on('pause', () => (playBtn.textContent = 'Play'));

        const link = wrapper.appendChild(document.createElement('a'));
        link.href = url;
        const mime = blob.type.split(';')[0] || 'audio/webm';
        const ext = mime.split('/')[1] || 'webm';
        link.download = 'recording.' + ext;
        link.textContent = 'Download';
        link.style.color = '#8ab4ff';

        recordingsContainer.prepend(wrapper);
      });

      record.on('record-progress', (ms) => {
        updateProgress(ms);
      });

      record.on('record-start', () => {
        debugLog('Recording started');
        recButton.textContent = 'Stop';
        recButton.disabled = false;
        pauseButton.style.display = 'inline-flex';
        pauseButton.textContent = 'Pause';
      });

      record.on('record-pause', () => {
        pauseButton.textContent = 'Resume';
      });

      record.on('record-resume', () => {
        pauseButton.textContent = 'Pause';
      });

      record.on('record-stop', () => {
        debugLog('Recording stopped');
        recButton.textContent = 'Record';
        pauseButton.style.display = 'none';
        pauseButton.textContent = 'Pause';
        resetProgress();
      });
    };

    const ensureDevices = async () => {
      try {
        debugLog('Getting audio devices...');
        const devices = await RecordPlugin.getAvailableAudioDevices();
        debugLog('Found ' + devices.length + ' audio devices');
        micSelect.innerHTML = '<option value="" hidden>Sélection micro</option>';
        devices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || device.deviceId || ('Micro ' + (index + 1));
          micSelect.appendChild(option);
          debugLog('Device ' + index + ': ' + option.text);
        });
        if (devices.length && !micSelect.value) {
          micSelect.value = devices[0].deviceId;
        }
        return devices.length > 0;
      } catch (err) {
        showError('Erreur accès périphériques: ' + err.message);
        debugLog('Device error: ' + err.message);
        return false;
      }
    };

    const startRecording = async () => {
      if (!record) {
        showError('Record plugin non initialisé');
        return;
      }
      if (record.isRecording() || record.isPaused()) {
        debugLog('Already recording or paused');
        return;
      }
      recButton.disabled = true;
      try {
        const deviceId = micSelect.value || undefined;
        debugLog('Starting recording with deviceId: ' + deviceId);
        await record.startRecording({ deviceId });
      } catch (err) {
        showError('Erreur démarrage: ' + err.message);
        debugLog('Start error: ' + err.message);
        recButton.textContent = 'Record';
        pauseButton.style.display = 'none';
      } finally {
        recButton.disabled = false;
      }
    };

    const stopRecording = () => {
      if (record && (record.isRecording() || record.isPaused())) {
        record.stopRecording();
      }
    };

    const toggleRecording = () => {
      if (!record) {
        return;
      }
      if (record.isRecording() || record.isPaused()) {
        stopRecording();
      } else {
        startRecording();
      }
    };

    const togglePause = () => {
      if (!record) {
        return;
      }
      if (record.isPaused()) {
        record.resumeRecording();
      } else {
        record.pauseRecording();
      }
    };

    pauseButton.onclick = togglePause;
    recButton.onclick = toggleRecording;

    document.querySelector('#scrollingWaveform').onclick = (e) => {
      scrollingWaveform = e.target.checked;
      if (continuousWaveform && scrollingWaveform) {
        continuousWaveform = false;
        document.querySelector('#continuousWaveform').checked = false;
      }
      createWaveSurfer();
      startRecording();
    };

    document.querySelector('#continuousWaveform').onclick = (e) => {
      continuousWaveform = e.target.checked;
      if (continuousWaveform && scrollingWaveform) {
        scrollingWaveform = false;
        document.querySelector('#scrollingWaveform').checked = false;
      }
      createWaveSurfer();
      startRecording();
    };

    const initialize = async () => {
      try {
        debugLog('Checking WaveSurfer...');
        if (typeof WaveSurfer === 'undefined') {
          showError('WaveSurfer non chargé');
          return;
        }
        debugLog('WaveSurfer OK');
        
        if (typeof RecordPlugin === 'undefined') {
          showError('RecordPlugin non chargé');
          return;
        }
        debugLog('RecordPlugin OK');
        
        createWaveSurfer();
        const hasDevice = await ensureDevices();
        if (hasDevice) {
          debugLog('Starting auto-record...');
          await startRecording();
        } else {
          showError('Aucun micro détecté');
        }
      } catch (err) {
        showError('Init error: ' + err.message);
        debugLog('Init error: ' + err.message);
      }
    };

    window.visualizerBridge = {
      start: startRecording,
      stop: stopRecording,
      toggle: toggleRecording,
      pause: togglePause,
      refreshDevices: ensureDevices,
    };

    // Démarrer dès que le module est chargé
    initialize();
  </script>
</body>
</html>
