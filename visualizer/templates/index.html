<!DOCTYPE html>
<html lang='fr'>
<head>
  <meta charset='utf-8'>
  <title>Visualiseur Audio Indépendant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/visualizer.css') }}">
</head>
<body>
  <div class='panel'>
    <div class='toolbar'>
      <select id='mic-select'><option value='' hidden>Sélection micro</option></select>
      <span id='status'>Monitoring...</span>
      <span id='sse-status' title='SSE connection'></span>
    </div>

    <div id='mic' style='margin-top:12px;'></div>

    <div id='preview-container'>
      <div id='preview-text' class='empty'>En attente de parole...</div>
    </div>

    <div id='error'></div>
  </div>

  <script src='https://unpkg.com/wavesurfer.js@7'></script>

  <!-- Inject SSE port from Flask -->
  <script>
    window.SSE_PORT = {{ sse_port }};
  </script>

  <script type='module' src="{{ url_for('static', filename='js/visualizer.js') }}"></script>
</body>
</html>
